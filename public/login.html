<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — IT Support Helpdesk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f8fafc;
    }
    .account-chip.active {
      background-color: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .account-chip.active .chip-meta {
      color: #94a3b8;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-900 font-sans antialiased">

  <div class="w-full max-w-md">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-10 h-10 rounded-lg bg-slate-900 text-white flex items-center justify-center mx-auto mb-3">
        <i data-lucide="headphones" class="w-5 h-5"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-slate-950">IT Support Helpdesk</h1>
      <p class="text-xs text-slate-500 mt-1">Masuk untuk mengajukan atau mengelola tiket IT</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      
      <!-- Error Notification -->
      <div id="errorBox" class="hidden mb-4 p-3 rounded-lg bg-slate-50 border border-red-200 text-red-600 text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-red-500"></i>
        <span id="errorMsg">Username atau password salah.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Username
          </label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="admin / siti.rahma" 
              autocomplete="username" 
              required 
              class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-slate-900 focus:bg-white transition"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Password
          </label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              autocomplete="current-password" 
              required 
              class="w-full pl-9 pr-9 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-slate-900 focus:bg-white transition font-mono"
            />
            <button 
              type="button" 
              id="togglePw" 
              title="Tampilkan / Sembunyikan Password" 
              class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-700 transition"
            >
              <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="loginBtn" 
          class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs rounded-lg transition duration-150 flex items-center justify-center gap-2"
        >
          <span id="btnText">Masuk</span>
        </button>
      </form>

      <!-- Demo Accounts Switcher (Simple, clean, no rainbow colors) -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Pilih Akun Demo</span>
          <span class="text-[10px] text-slate-400">Klik untuk isi</span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-left">
          
          <!-- Admin -->
          <button 
            type="button" 
            onclick="fillAccount('admin', 'admin123', this)" 
            class="account-chip p-2.5 rounded-lg border border-slate-200 hover:border-slate-400 bg-white transition text-left"
          >
            <div class="font-bold text-xs text-slate-900 flex items-center justify-between">
              <span>Ahmad</span>
              <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-slate-100 text-slate-700 border border-slate-200 uppercase">Admin</span>
            </div>
            <div class="chip-meta text-[11px] text-slate-500 font-mono mt-0.5">admin / admin123</div>
          </button>

          <!-- User 1 -->
          <button 
            type="button" 
            onclick="fillAccount('siti.rahma', 'user123', this)" 
            class="account-chip p-2.5 rounded-lg border border-slate-200 hover:border-slate-400 bg-white transition text-left"
          >
            <div class="font-bold text-xs text-slate-900 flex items-center justify-between">
              <span>Siti Rahma</span>
              <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-100 text-slate-600">Finance</span>
            </div>
            <div class="chip-meta text-[11px] text-slate-500 font-mono mt-0.5">siti.rahma</div>
          </button>

          <!-- User 2 -->
          <button 
            type="button" 
            onclick="fillAccount('bambang.w', 'user123', this)" 
            class="account-chip p-2.5 rounded-lg border border-slate-200 hover:border-slate-400 bg-white transition text-left"
          >
            <div class="font-bold text-xs text-slate-900 flex items-center justify-between">
              <span>Bambang W.</span>
              <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-100 text-slate-600">Direksi</span>
            </div>
            <div class="chip-meta text-[11px] text-slate-500 font-mono mt-0.5">bambang.w</div>
          </button>

          <!-- User 3 -->
          <button 
            type="button" 
            onclick="fillAccount('anisa.m', 'user123', this)" 
            class="account-chip p-2.5 rounded-lg border border-slate-200 hover:border-slate-400 bg-white transition text-left"
          >
            <div class="font-bold text-xs text-slate-900 flex items-center justify-between">
              <span>Anisa M.</span>
              <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-100 text-slate-600">HRD</span>
            </div>
            <div class="chip-meta text-[11px] text-slate-500 font-mono mt-0.5">anisa.m</div>
          </button>

        </div>
      </div>

    </div>

    <!-- Footer Note -->
    <p class="text-center text-[11px] text-slate-400 mt-5">
      Sistem Internal Helpdesk IT Support &bull; v1.0
    </p>

  </div>

  <script>
    lucide.createIcons();

    // Check if already authenticated
    (async () => {
      try {
        const r = await fetch('/api/auth/me');
        const d = await r.json();
        if (d.success) {
          window.location.href = d.data.role === 'admin' ? '/admin' : '/user';
        }
      } catch {}
    })();

    // 1-Click Fill Helper
    function fillAccount(username, password, el) {
      document.querySelectorAll('.account-chip').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');

      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
      document.getElementById('errorBox').classList.add('hidden');
      document.getElementById('password').focus();
    }

    // Toggle Password Visibility
    const pwInput = document.getElementById('password');
    const eyeBtn = document.getElementById('togglePw');
    eyeBtn.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeBtn.innerHTML = isHidden 
        ? '<i data-lucide="eye-off" class="w-4 h-4"></i>' 
        : '<i data-lucide="eye" class="w-4 h-4"></i>';
      lucide.createIcons();
    });

    // Form Submit Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      errorBox.classList.add('hidden');
      loginBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = data.data.role === 'admin' ? '/admin' : '/user';
        } else {
          errorMsg.textContent = data.message || 'Username atau password salah.';
          errorBox.classList.remove('hidden');
          loginBtn.disabled = false;
          btnText.textContent = 'Masuk';
        }
      } catch (err) {
        errorMsg.textContent = 'Gagal terhubung ke server.';
        errorBox.classList.remove('hidden');
        loginBtn.disabled = false;
        btnText.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
